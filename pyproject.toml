[project]
name = "halcyon-flight-ops"
version = "1.0.0"
description = "SRE / flight-ops agent for a fictional eVTOL operator: FastAPI dashboard + MCP tools on Amazon Bedrock AgentCore Runtime"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "mcp>=1.10.0,<2",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "mcp_server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"mcp_server/server.py" = ["S104"]  # 0.0.0.0 is the AgentCore container contract, no host port is published
